<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg" cx="45%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#7a3a9a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#160e24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#160e24" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="light" cx="55%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(180,140,220,0.5)"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#160e24"/>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#light)" opacity="0.7"/>
  <!-- Simulated subject forms -->
  <ellipse cx="800" cy="480" rx="400" ry="280" fill="#7a3a9a" opacity="0.15"/>
  <ellipse cx="600" cy="350" rx="200" ry="160" fill="rgba(180,140,220,0.5)" opacity="0.08"/>
  <!-- Grain overlay -->
  <rect width="1600" height="900" filter="url(#noise)" opacity="0.12"/>
  <!-- Vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="40%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#160e24" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>