<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'>
  <defs>
    <radialGradient id='bg' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='rgb(40,60,200)' stop-opacity='0.9'/>
      <stop offset='60%' stop-color='#0a0f2e' stop-opacity='1'/>
      <stop offset='100%' stop-color='#030108' stop-opacity='1'/>
    </radialGradient>
    <filter id='n'>
      <feTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/>
      <feColorMatrix type='saturate' values='0'/>
      <feBlend in='SourceGraphic' mode='multiply'/>
    </filter>
    <radialGradient id='light' cx='40%' cy='35%' r='45%'>
      <stop offset='0%' stop-color='rgb(120,120,240)' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='transparent' stop-opacity='0'/>
    </radialGradient>
  </defs>
  <rect width='100%' height='100%' fill='url(#bg)'/>
  <rect width='100%' height='100%' fill='url(#light)'/>
  <rect width='100%' height='100%' fill='#1d4ed8' opacity='0.12' filter='url(#n)'/>
  <text x='800' y='460' font-family='Georgia,serif' font-size='48' fill='rgba(255,255,255,0.15)' text-anchor='middle' font-style='italic'>
    talkmasters
  </text>
</svg>